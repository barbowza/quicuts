# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Source of truth: iTerm2's own menu bar, read via the Accessibility API
# (AXMenuItemCmdChar / CmdModifiers / CmdVirtualKey) from iTerm2 3.6.11.
# Synced 2026-08-22. macOS-injected items (Sequoia window tiling, Dictation,
# Emoji & Symbols) and user-specific saved arrangements are excluded.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
