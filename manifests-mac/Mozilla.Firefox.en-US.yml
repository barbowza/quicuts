# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Firefox Developer Edition with
# `just mac-menus org.mozilla.firefoxdeveloperedition` (2026-09-01); the
# non-menu ones (tab cycling, address bar, quick find, reader mode) from
# Mozilla's Mac keyboard-shortcut list. macOS-injected Apple-menu and
# window-tiling rows are deliberately excluded — they are not Firefox's.
#
# One manifest, three bundle ids: release, Developer Edition and Nightly
# ship as separate apps with identical shortcuts.
PackageName: Mozilla.Firefox
Name: Firefox
WindowFilter:
  - org.mozilla.firefox
  - org.mozilla.firefoxdeveloperedition
  - org.mozilla.nightly
BackgroundProcess: false
Shortcuts:
  - SectionName: Tabs and windows
    Properties:
      - Name: New tab
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - T
      - Name: New window
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - N
      - Name: New private window
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - P
      - Name: Close tab
