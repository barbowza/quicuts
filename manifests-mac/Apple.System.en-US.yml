PackageName: Apple.System
Name: macOS
WindowFilter: "*"
BackgroundProcess: true
Shortcuts:
  - SectionName: System
    Properties:
      - Name: Spotlight
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - Space
      - Name: Switch apps
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - Tab
      - Name: Mission Control
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - Up
      - Name: Application windows
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - Down
      - Name: Force Quit
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - Esc
      - Name: Lock screen
        Shortcut:
        - Win: true
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - Q
