# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Xcode with
# `just mac-menus com.apple.dt.Xcode` (2026-10-13). Apple-menu, window-tiling and
# generic Edit rows (Undo, Copy …) are deliberately excluded.
# Xcode does not localise its key equivalents (it reports "\" on this
# British-PC Mac), so its punctuation is taken as read.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Apple.Xcode
Name: Xcode
WindowFilter: "com.apple.dt.Xcode"
BackgroundProcess: false
