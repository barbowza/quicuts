# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Microsoft Edge 155 with
# `just mac-menus com.microsoft.edgemac` (2026-10-13). The non-menu tab
# shortcuts (⌘1–8, ⌘9, ⌘⌥←/→) are Chromium's, shared with Chrome; see
# Google.Chrome.en-US.yml. Apple-menu, window-tiling and generic Edit rows
# (Undo, Copy …) are deliberately excluded — they are not Edge's.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
#
# One manifest, two bundle ids: release and Beta (both in host.rs's browser class).
PackageName: Microsoft.Edge
Name: Microsoft Edge
WindowFilter:
  - com.microsoft.edgemac
  - com.microsoft.edgemac.beta
BackgroundProcess: false
Shortcuts:
