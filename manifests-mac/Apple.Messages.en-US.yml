# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Messages with
# `just mac-menus com.apple.MobileSMS` (2026-10-13). Apple-menu, window-tiling and
# generic Edit rows (Undo, Copy …) are deliberately excluded.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Apple.Messages
Name: Messages
WindowFilter: "com.apple.MobileSMS"
BackgroundProcess: false
Shortcuts:
  - SectionName: Messages
    Properties:
      - Name: New message
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - N
      - Name: Send message
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<Enter>"
      - Name: Reply to message
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - R
      - Name: Continue last reply
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - R
      - Name: Tapback
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - T
      - Name: Edit last message
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - E
      - Name: Send later
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - L
      - Name: Find
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - F
  - SectionName: Conversations
    Properties:
      - Name: Next conversation
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - Tab
      - Name: Previous conversation
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: true
          Alt: false
          Keys:
            - Tab
      - Name: Show details
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - I
      - Name: Show contact card
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - B
      - Name: Mark as unread
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - U
      - Name: Mark all as read
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: true
          Keys:
            - U
      - Name: Hide alerts
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - M
      - Name: Send mail
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - E
  - SectionName: View
    Properties:
      - Name: All messages
        Shortcut:
        - Win: true
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - "<1>"
      - Name: Spam
        Shortcut:
        - Win: true
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - "<2>"
      - Name: Recently deleted
        Shortcut:
        - Win: true
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - "<3>"
      - Name: Unread
        Shortcut:
        - Win: true
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - U
      - Name: Make text bigger
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "+"
      - Name: Make text smaller
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "-"
      - Name: Make text normal size
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - "<0>"
  - SectionName: Format
    Properties:
      - Name: Bold
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - B
      - Name: Italic
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - I
      - Name: Underline
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - U
      - Name: Text effects (Big, Small, Shake, Nod, Explode, Ripple, Bloom, Jitter; 1-8)
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - "<1>"
