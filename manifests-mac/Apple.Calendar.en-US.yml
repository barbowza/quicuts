# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Calendar with
# `just mac-menus com.apple.iCal` (2026-10-13). Apple-menu, window-tiling and
# generic Edit rows (Undo, Copy …) are deliberately excluded.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Apple.Calendar
Name: Calendar
WindowFilter: "com.apple.iCal"
BackgroundProcess: false
Shortcuts:
  - SectionName: Events
    Properties:
      - Name: New event or reminder
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - N
      - Name: Edit event
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - E
      - Name: Duplicate
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - D
      - Name: Get info
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - I
      - Name: Show Inspector
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - I
      - Name: Mark as completed
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - C
      - Name: Availability panel
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - A
      - Name: Find
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - F
  - SectionName: View
    Properties:
      - Name: Day
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<1>"
      - Name: Week
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<2>"
      - Name: Month
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<3>"
      - Name: Year
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<4>"
      - Name: Go to today
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - T
      - Name: Go to date
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - T
      - Name: Next day, week, month or year
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<Right>"
      - Name: Previous day, week, month or year
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<Left>"
      - Name: Next occurrence
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "]"
      - Name: Previous occurrence
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "["
      - Name: Zoom in
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "+"
      - Name: Zoom out
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "-"
      - Name: Refresh calendars
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - R
  - SectionName: Calendars
    Properties:
      - Name: New calendar
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - N
      - Name: New calendar subscription
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: true
          Keys:
            - S
      - Name: Calendar window
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "<0>"
      - Name: Next tab
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - Tab
      - Name: Previous tab
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: true
          Alt: false
          Keys:
            - Tab
      - Name: Print
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - P
