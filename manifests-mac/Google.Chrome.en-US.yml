# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Source of truth: https://support.google.com/chrome/answer/157179
# Mac tab of that article; synced 2026-08-22.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Google.Chrome
