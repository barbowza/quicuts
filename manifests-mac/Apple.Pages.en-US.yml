# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Pages with
# `just mac-menus com.apple.iWork.Pages` (2026-10-13). Apple-menu, window-tiling and
# generic Edit rows (Undo, Copy …) are deliberately excluded.
# The reading Mac uses the British-PC layout, which macOS localises
# some key equivalents for: "#" and "~" there are US "\" and "|",
# and are written here as the US keys this en-US manifest names.
# Autofill rows (shown as "#") are left out: their US key is not certain.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Apple.Pages
Name: Pages
WindowFilter: "com.apple.iWork.Pages"
BackgroundProcess: false
Shortcuts:
