# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Source of truth: https://help.evernote.com/hc/en-us/articles/34296687388307-Keyboard-shortcuts
# Mac column of that article. Article updated 2026-08-07; last synced 2026-08-22.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
