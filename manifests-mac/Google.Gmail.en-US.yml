# macOS variant of the Windows hosted collection in `manifests/`. Same
# PackageName, same TitleMatch (Safari appends no browser suffix, but
# these are substring patterns, so they hit on every browser); the only
# divergence is the send/link chord, which is Cmd on macOS where the web
# app documents Ctrl on Windows. `Win: true` is PTSG's flag for Cmd.
PackageName: Google.Gmail
Name: Gmail
Host: browser
TitleMatch: "- Gmail"
Icon: Google.Gmail.png
Shortcuts:
  - SectionName: Compose and send
    Properties:
      - Name: Compose
        Description: Requires "Keyboard shortcuts on" in Gmail settings
        Recommended: true
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - C
      - Name: Send
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - Enter
      - Name: Reply
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - R
      - Name: Reply all
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - A
      - Name: Forward
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - F
      - Name: Insert link
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - K
  - SectionName: Navigation
    Properties:
      - Name: Search mail
        Recommended: true
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - /
      - Name: Go to Inbox
        Description: Press g, then i
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - G
            - I
      - Name: Go to Starred
        Description: Press g, then s
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - G
            - S
      - Name: Go to Sent
        Description: Press g, then t
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - G
            - T
      - Name: Go to Drafts
        Description: Press g, then d
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - G
            - D
      - Name: Newer conversation
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - K
      - Name: Older conversation
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - J
      - Name: Open conversation
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - O
      - Name: Back to conversation list
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - U
  - SectionName: Actions
    Properties:
      - Name: Archive
        Recommended: true
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - E
      - Name: Delete
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "#"
      - Name: Report spam
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "!"
      - Name: Mark as read
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - I
      - Name: Mark as unread
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - U
      - Name: Star conversation
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - S
      - Name: Snooze
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - B
      - Name: Undo last action
        Recommended: true
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - Z
      - Name: Open keyboard shortcut help
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - /
  - SectionName: Selection
    Properties:
      - Name: Select conversation
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - X
      - Name: Select all conversations
        Description: Press *, then a
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "*"
            - A
