# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Source of truth: https://slack.com/help/articles/201374536 (Mac shortcuts;
# synced 2026-10-13), cross-checked against a running Slack's menu bar with
# `just mac-menus com.tinyspeck.slackmacgap`. The menu adds ⌘K (Jump to a
# conversation) and ⌘{ / ⌘} for workspaces. Workspace rows in the menu name
# this Mac's own workspaces (user data) and are generalised to ⌘1–9.
# Sections follow the Windows manifest. ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: SlackTechnologies.Slack
Name: Slack
WindowFilter: "com.tinyspeck.slackmacgap"
BackgroundProcess: false
Shortcuts:
