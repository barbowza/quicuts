# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Menu-bar shortcuts read from a running Preview with
# `just mac-menus com.apple.Preview` (2026-10-13). Apple-menu, window-tiling and
# generic Edit rows (Undo, Copy …) are deliberately excluded.
# Mac modifiers map to the PTSG flags as ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Apple.Preview
Name: Preview
WindowFilter: "com.apple.Preview"
BackgroundProcess: false
Shortcuts:
  - SectionName: File
    Properties:
      - Name: New from clipboard
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - N
      - Name: Open
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
