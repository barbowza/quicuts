PackageName: Microsoft.VSCode
Name: Visual Studio Code
WindowFilter:
  - com.microsoft.VSCode
  # VS Code forks that keep its default keymap: Cursor (a ToDesktop build,
  # hence the opaque id) and Google Antigravity.
  - com.todesktop.230313mzl4w4u92
  - com.google.antigravity
BackgroundProcess: false
Shortcuts:
  - SectionName: General
    Properties:
      - Name: Command Palette
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - P
      - Name: Quick Open
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - P
      - Name: Toggle terminal
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - "`"
      - Name: Toggle sidebar
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - B
  - SectionName: Editing
    Properties:
      - Name: Find in files
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - F
      - Name: Go to line
        Shortcut:
        - Win: false
          Ctrl: true
          Shift: false
          Alt: false
          Keys:
            - G
      - Name: Add next match to selection
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - D
      - Name: Format document
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: true
          Alt: true
          Keys:
            - F
