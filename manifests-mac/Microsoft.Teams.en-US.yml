# Quicuts-maintained manifest (not from PowerToys — see NOTICE.txt).
# Source of truth: Microsoft's "Keyboard shortcuts for Microsoft Teams",
# macOS tab (support.microsoft.com, article 2e8e2a70; synced 2026-10-13),
# cross-checked against a running Teams' menu bar with
# `just mac-menus com.microsoft.teams2`. The menu has only standard rows, but
# it shows ⌘0 for Actual Size where the article says ⌃0; the menu wins.
# Rows the article gives two actions for the same keys (e.g. ⌘⇧A) keep the
# call action only. Sections follow the Windows manifest.
# ⌘=Win, ⌃=Ctrl, ⌥=Alt, ⇧=Shift.
PackageName: Microsoft.Teams
Name: Teams
WindowFilter: "com.microsoft.teams2"
BackgroundProcess: false
Shortcuts:
  - SectionName: General
    Properties:
      - Name: Show keyboard shortcuts
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - "."
