PackageName: Apple.Finder
Name: Finder
WindowFilter: "com.apple.finder"
BackgroundProcess: false
Shortcuts:
  - SectionName: Windows
    Properties:
      - Name: New Finder window
        Recommended: true
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - N
      - Name: New folder
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - N
      - Name: Get Info
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - I
  - SectionName: Files
    Properties:
      - Name: Quick Look
        Recommended: true
        Shortcut:
        - Win: false
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - Space
      - Name: Duplicate
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - D
      - Name: Move to Trash
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: false
          Alt: false
          Keys:
            - Backspace
      - Name: Show hidden files
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - .
      - Name: Go to folder
        Shortcut:
        - Win: true
          Ctrl: false
          Shift: true
          Alt: false
          Keys:
            - G
