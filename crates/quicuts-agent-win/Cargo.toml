[package]
name = "quicuts-agent-win"
description = "Quicuts Windows system agent: keyboard hook, foreground watcher, taskbar reader"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quicuts-agent"
path = "src/main.rs"

[dependencies]
quicuts-proto = { path = "../quicuts-proto" }
serde_json = { workspace = true }
anyhow = { workspace = true }
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_Graphics_Gdi",
]
