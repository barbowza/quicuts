[package]
name = "quicuts-agent-mac"
description = "Quicuts macOS system agent (sidecar)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quicuts-agent"
path = "src/main.rs"

[dependencies]
quicuts-proto = { path = "../quicuts-proto" }
anyhow = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSString", "NSURL", "NSOperation", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
